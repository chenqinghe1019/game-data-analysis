      pending_asset_event_name_count: 8
      event_property_row_count: 95
      common_event_property_count: 6
      named_user_property_count: 12
      unnamed_virtual_user_property_count: 1

    notes:
      - "数数项目表后缀已确认为 37：用户表 ta.v_user_37，事件表 ta.v_event_37；正式环境过滤条件仍待确认。"
      - "线上已确认 ta.v_user_37 不存在 domain、create_role_time 字段；新增日期统计使用 ta.v_event_37 的 register 事件日期（$part_date），不要套用其他项目的用户表创角字段。"
      - "用户 ID 体系页同时提供单账号单角色、单账号多角色两种模板，未标明萝卜4实际采用哪一种。"
      - "公共属性原表字段名为 sever，疑似 server 的拼写问题；在研发确认前必须按原文保留，不得静默改名。"
      - "线上已确认资产变更事件名为 asset_change；该事件是否统一覆盖 8 类产消及全部属性类型仍待确认。"
      - "level_result.carrot 与 level_result.clear 未填写显示名和属性类型。"
      - "累计充值金额用户属性未填写属性名，原表备注要求使用虚拟属性。"

    user_id_system:
      selected_mode: "pending_confirmation"
      options:
        - game_type: "单账号单角色"
          properties:
            - name: "#account_id"
              display_name: "账户ID"
              description: "系统属性"
              assignment: "设置为玩家账号ID即可"
            - name: "#distinct_id"
              display_name: "访客ID"
              description: "系统属性"
