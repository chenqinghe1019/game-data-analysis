  usage_notes:
    - "源表即使预留到第30日，只要当前真实最大成熟日只有 D17，cohort 补值就只能补到 D17。"
    - "D18+ 属于长期预测，不是插值。"
    - "阶段值直接下降通常是 cohort mix，不代表累计 LTV 真下降。"
    - "补值模型可信度优先看 leave-one-out 遮盖回测；长期模型还要额外看重叠区间偏差。"
