ltv_forecast_model:
  version: "v1.8"
  updated_at: "2026-09-10"
  purpose: "LTV 两阶段模型：先按逐日同样本加权倍率补全未成熟 cohort，再基于补全加权曲线做长期预测，并同时做重叠偏差校验与遮盖回测。"

  core_rules:
    day_mapping: "当日=D1，第1日=D2，以此类推。"
    stage_value: "StageLTV(Dn)=Σ[新增用户数_i×LTV_i(Dn)]/Σ新增用户数_i，仅统计真实成熟到 Dn 的 cohort。"
    same_sample_rule: "任意 Dt/D(t-1) 倍率的分子和分母必须使用同一批真实成熟到 Dt 的 cohort。"
    daily_multiplier: "R(t)=WeightedLTV_Dt(J(t))/WeightedLTV_D(t-1)(J(t))，J(t) 为真实成熟到 Dt 的 cohort。"
    imputation: "若 cohort i 的 Dt 未成熟，则 FilledLTV_i(Dt)=FilledLTV_i(D(t-1))×R(t)。"
    recursive: true
    actual_never_overwrite: true
    maturity_depth_rule: "补值矩阵的最大天数必须等于当前数据真实可观测的最大成熟天数；不能因为源表预留了更远列就生成无真实倍率依据的 cohort 补值。"
    long_term_separation: "超过真实最大成熟天数的 Dn 只能存在于长期预测层，不能写回 cohort 补值矩阵。"

  filled_stage_curve:
    formula: "FilledStageLTV(Dt)=Σ[新增用户数_i×FilledLTV_i(Dt)]/Σ全部新增用户数_i"
    actual_coverage: "真实成熟到 Dt 的新增人数/全部新增人数"
    usage: "长期拟合时必须同时参考实测覆盖率，低覆盖率区间不能直接决定长期增长 slope。"

  long_term_model:
    base_model: "对数累计 LTV 长尾"
    formula: "LTV(d)=AnchorLTV + slope×ln(d/AnchorDay)"
    slope_selection: "优先使用实测覆盖率仍相对可接受的补全阶段区间估计 slope；再用当前最大补全日重新锚定长期预测水平。"
    scenarios:
      conservative_slope_factor: 0.85
      base_slope_factor: 1.0
      aggressive_slope_factor: 1.15
    validation:
      overlap_consistency: "用训练区间估 slope，在后续仍有补全阶段值的重叠区间做 MAPE/WAPE/Bias 校验。"
      true_accuracy: "用 leave-one-out 遮盖回测：人为截断成熟 cohort，仅用其它 cohort 的逐日同样本倍率递推，再与真实后续 LTV 比较。"

