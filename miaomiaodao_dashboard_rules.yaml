miaomiaodao_dashboard_rules:
  updated_at: "2026-10-30"
  source: "用户明确纠正并确认"
  project: "喵喵岛"
  project_id: 52
  event_table: "ta.v_event_52"
  user_table: "ta.v_user_52"
  activation_report:
    report_id: 6073
    event: "active_log"
    dimension: "active_node"
    count: "按日期、节点对#user_id去重"
    node_names: ["Launch", "BeginLoading", "EndLoading", "Login", "EnterHome", "EndGuideMap", "BeginLiveBoxGuide", "EndLiveBoxGuide"]
    rule: "全部8个节点分开展示，保留原始名称；不能用active_log事件总人数代替节点人数。节点排列不代表已验证的时序漏斗。"
  first_day_key_behavior:
    report_id: 6074
    dimension: "level_id"
    start_event: "battle_start"
    settlement_event: "level_result"
    settlement_filter: "存在level_result事件，且level_result不为2；属性缺失但存在结算事件时仍计入。"
    exit_value: 2
    exit_meaning: "主动退出"
    rule: "主动退出不计结算；结算人数不能用通关人数代替。开始和结算均按关卡、首日用户去重。"
    scope: "创角当天"
    ratio_denominator: "沿用原报表首日新增人数，列名明确写占首日新增；不是通关人数/开始人数。"
  sibling_consistency:
    report_id: 6075
    rule: "首日关卡通关率的结算场次及结算人数也排除level_result=2；通关仍使用level_result=1。"
  change_discipline:
    - "跨项目复用前确认事件参数维度及枚举；不根据事件名自行代入玩法、任务、付费转化。"
    - "仅按已确认业务口径修改，未确认的中文映射和漏斗顺序不编造。"
  visualization_reference_20261030:
    source: "用户提供的激活登录及首日关键行为表格截图"
    activation:
      report_id: 6073
      chart_type: "原生交叉表"
      row_dimensions: ["node_id"]
      column_dimensions: ["日期，降序"]
      metrics: ["人数", "转化率"]
      ratio: "同日节点去重人数/同日Launch去重人数"
      style: "无色阶，两位百分数，保留8个原始节点名称和原有节点顺序"
    first_day_behavior:
      report_id: 6074
      chart_type: "原生交叉表"
      row_dimensions: ["新增日期，降序", "新增玩家数"]
      column_dimensions: ["关卡ID，按SQL数值顺序"]
      metrics: ["开始率", "结算率"]
      ratio: "分母为当日新增玩家数，结算排除主动退出2"
      style: "无色阶，两位百分数，按实际level_id自动展开关卡列"
    dashboard_card:
      display: "图表"
      size: "大图"
      save_rule: "保存图表并确认后，返回SQL页更新报表；看板报表设置必须选择图表模式，不能继续显示明细数据。"
