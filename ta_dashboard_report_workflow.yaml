ta_dashboard_report_workflow:
  cdp_startup:
    script: ".codex/scripts/ta_start_cdp.ps1"
    chrome_exe: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
    user_data_dir: "%TEMP%\\chrome-cdp-debug"
    debug_port: 9222
    viewport: "1920x1080"
    steps:
      - "运行 .codex\\scripts\\ta_start_cdp.ps1 -Navigate"
      - "等待 Chrome 窗口出现，用户在窗口内手动输入账号密码完成登录。"
      - "登录完成后，用 ta_cdp_tool.ps1 接管已登录会话，无需再做其他配置。"
    notes:
      - "Chrome 以独立 user-data-dir 启动，不影响用户的正常 Chrome 会话。"
      - "CDP 已在线时脚本自动跳过启动，幂等可重复运行。"
      - "ta_cdp_tool.ps1 依赖同一端口 9222；如端口被占用，先 Stop-Process chrome 再重试。"
      - "不保存、不打印 ACCESS_TOKEN；所有 JS 脚本仅将 token 用于 Authorization 请求头。"

  login_policy:
    username: null
    password: null
    rule: "Codex 打开浏览器；用户手动登录并完成验证；Codex 只接管已登录会话继续操作。"

  project_switching:
    rule:
      - "操作任何看板或 SQL 前，先确认右上角当前项目。"
      - "切换项目后，进入 SQL 查询读取当前项目的表结构。"
      - "不要假设表后缀固定；以当前项目展示的 v_user_xx、v_event_xx 为准。"
      - "跨项目复用 SQL 时，必须先做表后缀、字段名、事件名、日期字段映射。"

  cross_project_dashboard_copy:
    preferred_path:
      - "源项目看板侧栏‘+’菜单提供‘导出看板’，只勾选目标看板后导出 JSON。"
      - "目标项目同一菜单提供‘导入看板’，导入时再选择目标项目空间。"
      - "若当前浏览器环境无法取得导出的本地 JSON，则逐张复制 SQL 报表；不要把‘导出成功’当作目标项目已完成。"
    manual_copy_steps:
      - "先在目标项目空间新建空看板，记录 dashboardId。"
      - "读取源看板的报表顺序、SQL、动态参数、图表字段、图内筛选器、便签和预计算设置。"
      - "以目标项目已有 SQL 报表创建副本，保留可复用的参数或明细表配置，再替换为经过字段映射的 SQL。"
      - "目标看板暂时未出现在‘保存至看板’下拉框时，刷新报表页；也可先保存报表，再从目标看板‘添加图表 → 已存报表’加入。"
      - "复制过程中误加到旧看板的卡片必须在旧看板移除；移除卡片不会删除已存报表。"
      - "逐张运行成功并保存图表，最后在目标看板统一设为大图、补充便签、启用定时预计算。"
    mapping_checklist:
      - "事件表、用户表的项目后缀。"
      - "登录事件名与在线时长事件名。"
      - "用户属性时间类型；timestamp 字段不能再套 from_unixtime。"
      - "历史充值金额单位；分转元时除以 100.0。"
      - "自定义维表是否在目标项目存在；缺失时必须明确记录降级行为，不能静默伪造已认证数据。"
    validation:
      - "核对目标项目名、项目空间、看板名和 dashboardId。"
      - "核对每张报表返回行数、动态参数默认值、图内筛选器和卡片尺寸。"
      - "定时预计算保存后，看板顶部应出现‘预计算-未开始’或‘预计算-已完成’状态。"

  ui_end_to_end_dashboard_building:
    purpose: "通过数数后台界面从零搭建 SQL 报表看板时使用。"
    navigation:
      dashboard_url_pattern: "#/panel/panel/{projectId}_{dashboardId}_0"
      report_url_pattern: "#/tga/ide/{projectId}_{reportId}?fromPanel={projectId}_{dashboardId}"
      route_refresh_note: "SPA 地址变化但页面未刷新时，通过界面点击目标项或重新载入目标地址，再核对页面标题和右上角项目名。"
    steps:
      - step: 1
        name: "确认项目"
        actions:
          - "从右上角项目选择器切换到目标项目。"
          - "确认页面顶部显示的项目名正确。"
          - "进入 SQL 查询的表结构，核对 projectId、事件表、用户表、事件名和实际属性名。"
      - step: 2
        name: "创建看板"
        actions:
          - "进入看板模块，在个人空间或指定项目空间中新建看板。"
          - "名称使用‘项目名-主题’格式，便于后续检索，例如‘萝卜4小游戏-广告分析’。"
          - "记录创建后的 dashboardId 和看板地址。"
      - step: 3
        name: "编写并校验 SQL"
        actions:
          - "先用小范围日期查询真实事件、字段类型和枚举值，再编写正式统计 SQL。"
          - "为注册日期和数据日期分别配置 PartDate 参数，避免两个时间口径互相覆盖。"
          - "渠道、新老用户等固定选项使用 Selector；自由输入的关卡名称等使用 Variable。"
          - "点击‘计算’，等待查询结果成功；错误时按错误列名或参数表达式修正后重跑。"
      - step: 4
        name: "保存报表"
        actions:
          - "在查询结果区点击‘保存报表’或‘更新报表’，填写明确的报表名和口径备注。"
          - "新建同类报表时可使用‘创建副本’，再分别修改 SQL、名称和备注，减少重复配置。"
          - "记录 reportId，并确认报表已加入目标看板。"
      - step: 5
        name: "配置表格图表"
        actions:
          - "在查询结果右侧点击图表编辑按钮，选择一维表。"
          - "把日期、关卡、广告点等文本字段按阅读顺序拖到‘行 / 分组’。"
          - "把人数、次数、均值和比例字段拖到‘列 / 指标’。"
          - "检查遗漏和重复字段，点击‘保存’并在确认框中再次点击‘确定’。"
      - step: 6
        name: "同步 SQL 与图表"
        actions:
          - "保存图表后返回 SQL 查询页，再点击‘更新报表’。"
          - "SQL 输出列发生变化时重新打开图表配置，确认旧绑定没有丢失。"
          - "参数显示名、默认值或备注变化后，必须重新计算并更新报表。"
      - step: 7
        name: "配置看板卡片"
        actions:
          - "打开目标看板，确认所有报表卡片均已出现。"
          - "宽表或多维度表改为大图；必要时折叠左侧导航检查实际可读宽度。"
          - "同一主题的卡片按汇总、分布、分层汇总、明细顺序排列。"
      - step: 8
        name: "最终验收"
        actions:
          - "等待所有卡片计算完成，确认没有查询错误或空参数错误。"
          - "逐张核对标题、数据日期、维度顺序、指标列和默认筛选。"
          - "实际切换一次渠道、新老用户或关卡参数，确认筛选能重新计算。"
          - "记录 dashboardId、reportId、默认筛选、关键字段和特殊口径到项目 YAML。"
    save_order: "计算成功 → 保存或更新报表 → 编辑并保存图表 → 返回 SQL 页更新报表 → 打开看板验收。"
    common_failures:
      - symptom: "图表字段已经拖入，但回到看板后消失。"
        cause: "只保存了图表编辑页，未在 SQL 查询页再次更新报表，或确认框未完成。"
        fix: "重新保存图表，返回 SQL 页点击更新报表，并重新载入看板检查。"
      - symptom: "动态参数已显示，但计算时报参数表达式错误。"
        cause: "手写的参数占位符格式与系统生成格式不一致，或参数默认值为空。"
        fix: "从‘动态参数’菜单插入对应类型，保留系统生成的占位符，填写非空默认值后重算。"
      - symptom: "需求文档字段可以看到，但 SQL 提示列不存在。"
        cause: "需求表字段名与线上实际字段名不一致。"
        fix: "回到表结构或用小范围明细查询核对真实字段；修正后把映射写回项目 YAML。"
      - symptom: "广告次数分布没有 0 次用户。"
        cause: "从广告事件表直接聚合，未以当日活跃用户为全集。"
        fix: "先生成当日活跃用户集合，再 LEFT JOIN 每名用户的广告完播次数并将空值转为 0。"

  dashboard_report_editing:
    read_before_write:
      - "先读取看板 report list，记录 dashboardId、projectId、reportId、reportName、reportsVersion。"
      - "逐个读取 reportsearch，确认 SQL、动态参数、图表配置和报表名。"
      - "批量修改前按报表名确认业务口径，避免用同一段 SQL 覆盖不同报表。"
    save_checks:
      - "保存 SQL 后重新读取 reportsearch，确认 SQL 已落库。"
      - "保存图表配置后打开看板复查展示列、筛选器、动态参数。"
      - "卡片展示不完整时，把图表尺寸从中图调为大图。"

  dashboard_card_size_rule:
    default_size: "中图"
    large_size: "大图"
    switch_to_large_when:
      - "表格包含多个维度和多列 N 日指标，例如日期、媒体平台、新增当天分层、第1天到第7天指标。"
      - "看板卡片右侧核心指标列被截断，或必须明显横向滚动才能阅读。"
      - "用户截图中显示报表数据已出来，但卡片尺寸不足。"
    ui_steps:
      - "在看板报表卡片上打开报表内容设置。"
      - "找到图表尺寸。"
      - "从中图切换为大图。"
      - "点击应用。"
      - "回到看板复查表格是否完整、可读。"

  graph_save_pattern:
    endpoint: "POST /v1/ta/event/graph/save?projectId={projectId}&reportId={reportId}"
    content_type: "application/json;charset=UTF-8"
    body_keys: ["projectId", "reportId", "graphType", "confMap", "requisiteColumns"]
    notes:
      - "confMap 和 requisiteColumns 必须是 JSON.stringify 后的字符串，不能直接传对象。"
      - "confMap 路径：graphConf.confMap → parse → modify → re-stringify"
      - "requisiteColumns 路径：graphConf.requisiteColumns → parse → re-stringify"
      - "不要把 graphConf 整体作为 body；要把 confMap/requisiteColumns 解包后分别作为 body 的 top-level 字段。"
      - "format key 格式: '字段名@~@1'，value: { type: 'format', formatType: '...' }"

  completion_standard:
    - "批量生成报表不能只以创建成功作为完成标准。"
    - "每张报表都要完成 SQL 校验、图表配置校验、看板卡片尺寸校验。"
    - "如果大图后仍展示不完整，保留大图，并评估是否需要减少默认展示指标或调整图表布局。"

  dynamic_partdate_param:
    desc: "报表动态日期参数（如“新增日期”可选）的实现方式，参考报表 41_4914。"
    mechanism:
      - "在 SQL 里用宏 ${PartDate:dateN}（dateN 为参数名，如 date1/date2），它会展开成一个对当前作用域内 \"$part_date\" 列的日期范围过滤谓词。"
      - "宏绑定的是作用域里名为 \"$part_date\" 的列：可以是事件表物理分区列，也可以是子查询里用别名造出来的列。"
      - "要让参数过滤“注册日期/新增日期”，在子查询里把 date_format(create_role_time,'%Y-%m-%d') AS \"$part_date\"，再在外层 WHERE ${PartDate:date1} 即可。"
    qp_wiring:
      sqlVoParams: "events.sqlVoParams = [{paramType:'PartDate', paramDisplay:'新增日期', paramRemark:'', paramName:'date1', useTimezone:0}]（参数定义）"
      sqlViewParams: "eventView.sqlViewParams = [{paramType:'PartDate', quota:'C060', recentDay:'', startToNow:-1, startTime:'YYYY-MM-DD 00:00:00', endTime:'YYYY-MM-DD 00:00:00', startToYesterday:-1, paramName:'date1'}]（默认取值）"
      note: "校验/保存时 qp 必须同时带 sqlVoParams 和 sqlViewParams，宏才能在 fetchSqlQuery 里解析。多参数时 date1/date2 各配一份。"
    js_template_pitfall: "在 JS 反引号模板字符串里写 SQL 时，${PartDate:date1} 必须转义成 \\${PartDate:date1}，否则被当成 JS 插值。"

  reusable_ad_dashboard_pattern:
    applicable_to: "按日期、渠道、新老用户、广告点和关卡分析激励视频的 SQL 看板。"
    cohort_and_dimension_rules:
      registration_day: "从 register 事件按 #user_id 取最早 $part_date；注册日期参数使用独立的 PartDate。"
      channel: "渠道优先取用户表的注册渠道；缺失值统一显示为‘未知’。"
      active_users: "小游戏项目先核对实际前后台切换事件；萝卜4小游戏使用 ta_mg_show 对 #user_id 按日去重，login 只覆盖登录行为，不能直接作为日活。"
      new_users: "reg_day = 数据日期。"
      old_users: "reg_day < 数据日期。"
      editor_exclusion: "渠道选择‘全部’时也应默认过滤 channel_name <> 'EDITOR_PAGE'，避免编辑器测试数据进入业务看板。"
    ad_event_rules:
      views: "video_play_start 的事件次数和去重用户数。"
      completions: "video_play_end 的事件次数和去重用户数。"
      ad_position: "广告点使用 positiontag；创建 SQL 前仍需在当前项目表结构中复核。"
      progress: "chapter_speed 线上可能存成 0%-5%、5%-10% 等区间字符串；不要仅依据需求表中的‘数值’类型编写比较条件，先查询真实值。"
    metric_formulas:
      average_views: "视频观看次数 / 观看人数。"
      average_completions: "视频完播次数 / 完播人数。"
      completion_rate: "视频完播次数 / 视频观看次数。"
      completion_share: "当前广告点视频完播次数 / 当日全部广告点视频完播次数。"
      completer_share: "完播人数 / 观看人数。"
      penetration: "完播人数 / 当日活跃人数。"
    distribution_rule: "广告次数分布以 video_play_end 计数；从当日活跃用户集合 LEFT JOIN 每人完播次数，才能保留广告次数为 0 的用户。"
    level_rule: "名为‘关卡开始人数’的指标应使用 level_start 的去重用户数，不使用事件次数。"
    zero_division: "所有比率分母使用 nullif(..., 0)。"
    selector_alias_rule: "动态 Selector 引用 day、reg_day、channel_name 等别名时，必须在这些别名已经生成的外层 CTE 应用；不要在创建别名的同一层 WHERE 中引用，否则会出现 Column 'day' cannot be resolved。"
    dotted_level_sort: "关卡名为 1.1、1.2、1.10 等点分文本时，分别 split_part 主段和次段并 try_cast 为 integer 排序；不要按字符串排序，也不要把整个关卡名 cast 为 double。"
    percentage_display: "占比、率、百分比相关指标默认输出 0～1 的比例值，不乘 100；使用 cast(round(1.0000*numerator/nullif(denominator,0),4) as decimal(18,4)) 保留四位小数。仅在需求明确指定其他格式时调整。"
    failure_event_rule: "死亡和失败分开统计：死亡取 level_dead，失败取 level_result.is_win=false；失败数据为空时追查上报，不用死亡事件替代失败事件。"

  dynamic_variable_param:
    variable_syntax: "通过界面添加‘可变内容 Variable’时，系统生成的占位符格式为 ${Variable5}，不是 ${Variable:variable5}。"
    string_filter_example: "('${Variable5}'='全部' OR cast(level_id AS varchar)='${Variable5}')"
    configuration_steps:
      - "先在 SQL 中保留系统生成的变量占位符。"
      - "在参数列表中填写非空默认值，例如‘全部’。"
      - "点击参数行的编辑按钮，把显示名改成业务名称，例如‘关卡名称’，并补充填写示例。"
      - "重新计算成功后再更新报表，否则参数配置不会进入已存报表。"

  sql_graph_sync_lessons:
    - "修改 SQL 输出字段名后，旧图表中的同名绑定可能被移除；查询成功后必须重新进入图表配置复核维度和指标。"
    - "表格维度按阅读顺序配置，例如数据日期、关卡名称、广告点名称；其余数值字段放入指标区。"
    - "批量拖入大量指标后要检查重复项和遗漏项，保存图表后再返回 SQL 页面更新报表。"
    - "看板验收应等待所有卡片完成计算，并确认卡片无错误、动态参数可见、宽表可横向阅读。"

  github_sync_policy:
    remote: "origin"
    branch: "master"
    rule:
      - "本项目内任何 skill 或 YAML 新增、修改后，自动提交并推送到 GitHub。"
      - "提交范围只包含 .codex/skills、*.yaml、*.yml、README.md、.gitignore 等知识资产。"
      - "提交前检查不能包含账号、密码、ACCESS_TOKEN、Authorization Bearer、业务导出数据、截图或前端大包。"
    default_commit_message: "Update Codex project knowledge"
