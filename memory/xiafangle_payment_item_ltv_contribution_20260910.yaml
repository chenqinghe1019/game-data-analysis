updated_at: '2026-09-11'
topic: 下方了付费项 D1-D30 LTV 贡献评估
rules:
  - 新增 cohort 按 ta.v_user_41.create_role_time 的自然日筛选；先生成 cast(date(create_role_time) as varchar) "$part_date"，再使用 ${PartDate:date}。
  - 输出必须按新增日期 create_date 分组，同一新增日期下再拆 D1-D30 和付费项，不再把筛选区间内不同新增日期合并。
  - 标准成熟版：D1-D30 按玩家创角日计算，D1=创角当天，D30=创角+29天；每个 Dn 单独按成熟日期判断，只统计 target_date <= 昨天的玩家，不要求统一成熟到 D30。
  - 包含未成熟版：最多只展开到当前自然日，不展示未来 Dn；今天对应的 Dn 作为未成熟实时数据展示。
  - 付费事件使用 ta.v_event_41 的 pay_log；实际付费金额优先取 payment，当 payment=0 时取 token_payment，最终 /100 转为元，避免两个字段重复相加。
  - 付费有效事件筛选必须基于同一实际付费金额表达式 > 0。
  - 付费项LTV排除 pay_log.product_type='直充' 的订单，但 product_name 包含“钻石”的直充保留；该过滤同时作用于商品贡献和总LTV。
  - 付费项必须通过 product_id + product_name 双键关联 ta_ext.product_id_name_41；展示 product_id_name、price、product_type_one、product_type_two。
  - 商品表作为左表，未产生付费的商品也保留。
  - 付费项低贡献评估最新修订：不再统一从 D1 开始观察。先在当前筛选新增 cohort 内，按商品找到历史最早出现付费的相对创角天数，作为该商品“最早付费天数/开放日代理”。D1=创角当天，即 date_diff=0 展示为 D1。
  - 每个商品从自身最早付费天数开始向后观察 30 天。例如最早 D8 出现付费，则该商品观察窗口为 D8-D37。
  - 每个商品的成熟新增人数必须完整成熟到自身观察窗口结束日；例如 D8-D37，则只统计 create_date+36 <= 昨天的新增玩家，避免开放较晚礼包被统一 D30 分母稀释。
  - 开放后30日购买率 = 商品开放后30日付费人数 / 该商品对应成熟新增人数。
  - 开放后30日付费人数占比 = 商品开放后30日付费人数 / 同一相对观察窗口内全部付费人数。
  - 开放后30日LTV贡献 = 商品开放后30日付费金额 / 该商品对应成熟新增人数。
  - 开放后30日总LTV = 同一相对观察窗口内全部有效付费金额 / 该商品对应成熟新增人数。
  - 开放后30日LTV贡献占比 = 商品开放后30日付费金额 / 同一相对观察窗口内全部有效付费金额。
  - 因不同商品的最早付费天数可能不同，各商品“开放后30日LTV贡献占比”的分母窗口也不同，因此这些占比用于横向评估单商品效率，不要求所有商品贡献占比加总为1。
  - 商品无任何付费记录时无法推断开放天数，保留商品行并标记“无付费记录”；最早付费天数已识别但观察窗口未成熟时标记“观察窗口未成熟”；只有成熟新增人数>0时标记“可评估”。
  - 当前礼包简化评估采用颜色分级：红=优先简化，橙=建议合并/简化，黄=低效观察，绿=建议保留，灰=暂不评估；商品表已标记“废弃礼包”的单独按已废弃处理。
  - 当前数据分级阈值（比例值不转百分比）：红色为成熟窗口0人购买，或LTV贡献占比<=0.0002且付费人数占比<=0.0025；橙色为LTV贡献占比<=0.0010且付费人数占比<=0.0100；黄色为LTV贡献占比<=0.0026且付费人数占比<=0.0200，或LTV贡献占比<=0.0010，或付费人数占比<=0.0050；其余绿色保留。该阈值为本次商品池评估基准，后续可随版本分布调整。
  - 红/橙表示值得优先简化，不等于直接删除；下线前需核查礼包曝光、触发条件和功能性承接。观察窗口不完整的数据不强行纳入删减判断。
