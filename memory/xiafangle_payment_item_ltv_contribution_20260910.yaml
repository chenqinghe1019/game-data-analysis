updated_at: '2026-09-11'
topic: 下方了付费项 D1-D30 LTV 贡献评估
rules:
  - 新增 cohort 按 ta.v_user_41.create_role_time 的自然日筛选；先生成 cast(date(create_role_time) as varchar) "$part_date"，再使用 ${PartDate:date}。
  - 输出必须按新增日期 create_date 分组，同一新增日期下再拆 D1-D30 和付费项，不再把筛选区间内不同新增日期合并。
  - 标准成熟版：D1-D30 按玩家创角日计算，D1=创角当天，D30=创角+29天；每个 Dn 单独按成熟日期判断，只统计 target_date <= 昨天的玩家，不要求统一成熟到 D30。
  - 包含未成熟版：最多只展开到当前自然日，不展示未来 Dn；例如当前日期为 2026-09-10，则任何新增日期的生命周期行最多只到实际对应 2026-09-10 的 Dn。
  - 包含未成熟版不需要“应观察日期”“实际观察截止日期”“实际观察天数”字段；保留“成熟状态”，target_date < current_date 为成熟，target_date = current_date 为未成熟。
  - 包含未成熟版纳入今天实时未完整流水，因此今天对应的 Dn 作为未成熟数据展示；事件日期上限使用 current_date。
  - 付费事件使用 ta.v_event_41 的 pay_log；实际付费金额不是 payment + token_payment，而是优先取 payment：当 coalesce(payment,0) != 0 时取 payment；当 coalesce(payment,0) = 0 时改取 token_payment；最终 /100 转为元，避免两个字段同时有值时重复相加。
  - 付费有效事件筛选也必须基于同一实际付费金额表达式 > 0，不能只写 payment > 0，否则会漏掉 payment=0、token_payment>0 的订单。
  - 付费项LTV需排除 pay_log.product_type='直充' 的订单，但若该直充订单的 product_name 包含“钻石”则保留；即保留条件为 coalesce(product_type,'') <> '直充' OR strpos(coalesce(product_name,''),'钻石') > 0。该过滤必须同时作用于付费项贡献和总LTV，保证两者口径一致。
  - 付费项必须通过 product_id + product_name 两个键关联 ta_ext.product_id_name_41；配置字段可带 product_id_name、price、product_type_one、product_type_two。
  - 当日LTV贡献 = 同一新增日期 cohort 在对应 Dn 当天、该付费项产生的收入 / 该新增日期新增人数。
  - 累计LTV贡献 = 同一新增日期 cohort 从 D1 累计到当前实际 Dn、该付费项产生的收入 / 该新增日期新增人数；今天对应的未成熟 Dn 为截至查询时的实时部分累计。
  - 当日/累计LTV贡献占比以同口径过滤后的全部 pay_log 实际收入作为分母；未匹配配置表的付费仍会进入总LTV，但不会进入具体付费项行。
  - 付费项目不输出汇总行；内部可保留汇总分组仅用于计算新增人数、总LTV和贡献占比，最终结果只展示具体付费项。
  - 成熟版与未成熟版均为减少“各付费项LTV先四舍五入再加总”造成的差异，将当日LTV贡献、当日总LTV、累计LTV贡献、累计总LTV统一保留4位小数；金额仍保留2位，贡献占比保留4位且不自动转百分比。
  - 未匹配排查SQL需严格复用当前LTV的新增日期、D1-D30、payment/token_payment、直充排除规则，只输出无法按 product_id + product_name 命中 ta_ext.product_id_name_41 的有效付费；并标记“配置表无此product_id / product_id存在但product_name不一致 / 埋点字段为空”，用于定位总LTV与付费项加和差异。
  - 付费项低贡献评估新增 D1-D14 版本：必须以 ta_ext.product_id_name_41 商品表为左表，再 left join 付费结果，确保 0 购买、0 LTV 贡献商品也被展示。
  - D1-D14 低贡献评估必须展示商品一级分类 product_type_one、二级分类 product_type_two，并按一级分类、二级分类、商品观察。
  - D1-D14 低贡献评估中，累计付费人数占比 = 商品累计付费人数 / 同口径全部累计付费人数；另单独展示累计购买率 = 商品累计付费人数 / 成熟新增人数，避免两个指标混用。
  - D1-D14 低贡献评估优先观察累计LTV贡献占比与累计付费人数占比，结果按低贡献占比、低付费人数占比升序，便于定位双低商品。
