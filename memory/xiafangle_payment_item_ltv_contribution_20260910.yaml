updated_at: '2026-09-11'
topic: 下方了付费项 LTV 贡献与礼包简化评估
rules:
  - 新增 cohort 按 ta.v_user_41.create_role_time 的自然日筛选；先生成 cast(date(create_role_time) as varchar) "$part_date"，再使用 ${PartDate:date}。
  - 付费事件使用 ta.v_event_41 的 pay_log；实际付费金额优先取 payment，当 payment=0 时取 token_payment，最终 /100 转为元，避免两个字段重复相加。
  - 付费有效事件筛选必须基于同一实际付费金额表达式 > 0。
  - 付费项LTV排除 pay_log.product_type='直充' 的订单，但 product_name 包含“钻石”的直充保留；该过滤同时作用于具体礼包/小类贡献和总LTV。
  - 具体商品仍通过 product_id + product_name 双键关联 ta_ext.product_id_name_41，获取 product_type_one、product_type_two 等商品配置。
  - 历史 D1-D30 付费项明细版本继续保留，仅用于具体商品级拆解。
  - 礼包简化评估最新口径已从“具体礼包”改为“一级分类 + 二级分类（礼包小类）”汇总，同一小类下所有 product_id + product_name 合并统计，不再按礼包名逐个评估。
  - 每个礼包小类在当前 ${PartDate:date} 筛选新增 cohort 内，取该小类最早出现有效付费的相对创角天数作为“最早付费天数/开放日代理”；D1=创角当天，即 date_diff=0 展示为 D1。
  - 最新观察窗口为礼包小类开放后 7 天。例如最早 D15 付费，则观察窗口为 D15-D21。
  - 最新分母口径不再使用“成熟到观察窗口末日的人数”。只要玩家在该礼包小类开放当天存在 ta.v_event_41 的 in_out_log，即计入“开放日活跃人数”，作为购买率和LTV贡献的人群分母。
  - 开放日活跃必须严格匹配相对创角天数：active_offset = 最早付费offset；例如 D15 小类只取玩家创角后第14天当天存在 in_out_log 的玩家。
  - 开放后7日付费观察从开放当天开始，最多观察7个自然日；对于尚未走完7天的较新 cohort，统计到 current_date 为止，不因后续天数未成熟而排除该玩家。
  - 开放后7日购买率 = 该小类开放后7日付费人数 / 该小类开放日活跃人数。
  - 开放后7日付费人数占比 = 该小类开放后7日付费人数 / 同一批开放日活跃玩家在相同7日窗口内全部有效付费人数。
  - 开放后7日LTV贡献 = 该小类开放后7日付费金额 / 该小类开放日活跃人数。
  - 开放后7日总LTV = 同一批开放日活跃玩家在相同7日窗口内全部有效付费金额 / 开放日活跃人数。
  - 开放后7日LTV贡献占比 = 该小类开放后7日付费金额 / 同一批开放日活跃玩家在相同7日窗口内全部有效付费金额。
  - 输出增加“小类配置商品数”，用于判断同一二级分类下是否存在过多重复礼包/档位。
  - 小类无任何有效付费记录时无法推断开放天数，标记“无付费记录”；已识别开放天数但开放日无 in_out_log 玩家时标记“开放日无活跃玩家”；其余标记“可评估”。
  - 因不同礼包小类的最早付费天数不同，各小类的7日分母窗口也不同，LTV贡献占比主要用于横向判断小类效率，不要求跨小类加总为1。
  - 当前礼包简化颜色分级可继续沿用红/橙/黄/绿/灰，但在新7日小类口径跑出数据后，应按新分布重新校准阈值，不直接机械沿用30日商品级阈值。
