updated_at: '2026-09-11'
topic: 下方了付费项 LTV 贡献与礼包简化评估
rules:
  - 新增 cohort 按 ta.v_user_41.create_role_time 的自然日筛选；先生成 cast(date(create_role_time) as varchar) "$part_date"，再使用 ${PartDate:date}。
  - 付费事件使用 ta.v_event_41 的 pay_log；实际付费金额优先取 payment，当 payment=0 时取 token_payment，最终 /100 转为元，避免两个字段重复相加。
  - 付费有效事件筛选必须基于同一实际付费金额表达式 > 0。
  - 付费项LTV排除 pay_log.product_type='直充' 的订单，但 product_name 包含“钻石”的直充保留；该过滤同时作用于具体礼包/小类贡献和总LTV。
  - 具体商品仍通过 product_id + product_name 双键关联 ta_ext.product_id_name_41，获取 product_type_one、product_type_two 等商品配置。
  - 礼包简化评估最新口径按“一级分类 + 二级分类（礼包小类）”汇总，同一小类下所有 product_id + product_name 合并统计，不再按具体礼包名评估。
  - 每个礼包小类在当前 ${PartDate:date} 筛选新增 cohort 内，取该小类最早出现有效付费的相对创角天数作为“最早付费天数/开放日代理”；D1=创角当天，即 date_diff=0 展示为 D1。
  - 最新观察窗口为礼包小类开放后7天。例如最早 D15 付费，则观察窗口为 D15-D21。
  - 购买率分母最新修订为“开放后7日活跃人数”，不是只看开放当天活跃。玩家只要在该小类 Dk-D(k+6) 的7日窗口内任意一天存在 ta.v_event_41 的 in_out_log，即计入一次开放后7日活跃人数。
  - 开放后7日购买率 = 开放后7日活跃玩家中，在同一 Dk-D(k+6) 窗口内购买该小类的人数 / 开放后7日活跃人数。
  - 开放后7日付费人数占比 = 上述开放后7日活跃玩家中购买该小类的人数 / 同批活跃玩家在同窗口内全部有效付费人数。
  - 购买率/付费人数占比的人群分母与LTV分母必须严格拆开，开放后7日活跃人数不能作为标准LTV分母。
  - 标准LTV必须使用对应成熟新增口径。若小类最早开放日为 Dk，7日窗口终点为 D(k+6)，则LTV成熟新增人数 = 当前 ${PartDate:date} 筛选新增中已达到 D(k+6) 的全部新增玩家；达到对应天数当天即成熟，判断 target_date <= current_date。
  - 例如 D15 开放、观察 D15-D21，则LTV只使用已成熟到D21的新增 cohort；D21成熟新增人数作为该小类LTV相关指标统一分母。
  - 小类开放后7日LTV贡献 = 对应成熟新增玩家在 Dk-D(k+6) 内购买该小类的金额 / 对应成熟新增人数。
  - 小类对应成熟总LTV = 同一批成熟新增玩家从 D1 累计到 D(k+6) 的全部有效付费金额 / 对应成熟新增人数。
  - 小类开放后7日LTV贡献占比 = 同批成熟新增玩家 Dk-D(k+6) 该小类付费金额 / 同批成熟新增玩家 D1-D(k+6) 全部有效付费金额。
  - 因各小类开放天数不同，其对应成熟终点 Dn 不同；不同小类的总LTV需分别使用各自对应 Dn 的成熟新增区间计算。
  - 输出增加“小类配置商品数”，用于判断同一二级分类下是否存在过多重复礼包/档位。
  - 小类无任何有效付费记录时无法推断开放天数，标记“无付费记录”；开放后7日无 in_out_log 玩家时只影响购买率评估，不代表该小类没有LTV成熟数据。
  - 当前礼包简化颜色分级可继续沿用红/橙/黄/绿/灰，但需基于最新7日小类口径的数据分布重新校准，不直接机械沿用30日商品级阈值。
