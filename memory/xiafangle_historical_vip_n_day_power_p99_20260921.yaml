project: 下方了
project_code: xiafangle
project_id: 41
updated_at: '2026-09-21'
topic: 按历史每日累计VIP查看新增第N天战力明细并关联P99分位
parameter_fix:
  number_parameter: ${Number:number6}
  behavior: ThinkingData数值动态参数会展开为比较表达式，例如“<= 7”，不能放进cast()或当成裸数值使用
  correct_usage: "(date_diff('day', create_date, event_date) + 1) ${Number:number6}"
cohort:
  create_role_filter: ${PartDate:date}
  day_definition: 新增当天=1
  maturity: 只统计目标日期<=昨天
vip:
  source: ta.history_tag_41
  cluster_name: vip_level_today
  join: ta.v_user_41.#user_id = ta.history_tag_41.#long_id
  tag_date: 每个战力事件自然日转YYYYMMDD匹配$tag_date
  value: tag_value_num
  null_default: 0
power:
  event: change_power_log
  field: after
  rule: 每个玩家每个新增天数当天取max(after)作为当天最高战力
percentiles:
  group_by: [历史VIP, 新增天数]
  metrics: [P99]
  exclude: P100
  focus: P99
abnormal_rule:
  definition: 玩家新增第N天最高战力 > 同历史VIP同新增天数P99 * 3
  output: 仅保留异常战力玩家
detail:
  attach_percentiles_to_each_player: true
  extra_fields: [VIP样本人数, VIP平均最高战力, P99战力, 异常战力阈值, 战力状态, P99倍数]
sql_file: sql/xiafangle_power_detail_by_historical_vip_n_day_v41.sql

output_preference:
  abnormal_detail: 仅保留核心排查字段
  fields: [新增天数, 历史VIP, 账号ID, 角色名, 服务器ID, 最高战力, P99战力, 异常阈值, P99倍数]
  removed: [新增日期, 新增第N天日期, 用户ID, 最高战力时间, VIP样本人数, VIP平均最高战力, P0, P25, P50, P75, 战力状态]

mainline_sample_filter:
  events: [battle_star, battle_result]
  battle_type: 1
  level_field: map_id
  rule: 截至对应新增第N天，主线累计最大map_id必须>3
  excluded: 主线停留在1-3及之前的玩家不进入P99样本，也不会进入异常玩家结果
