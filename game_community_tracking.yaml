  data_type_principles_format: TA类型 | JSON类型 | 规则 | 建议场景
  data_type_principles:
  - 数值 | Number | 数据范围是-9E15至9E15，小数点最多保留3位 | 1.属性具备数值型运算场景（总和、中位数、均值等），如充值金额、消耗钻石量、过关时间（秒）、等级..... / 2.id相关属性，且id的先后关系和数值大小成正相关，如关卡id、服务器id等，如这类id非纯数值，则作为字符串处理 / 3.接上，对于用户相关id，如角色id等，虽然可能由全数字组成，但本身无数值含义，且位数可能很大，建议作为字符串处理
  - 字符串 | String | 字符的默认上限是2KB | 不适用其它类型的属性，都可以考虑使用字符串类型，包括一些目前TA不支持的复杂类型，如map类型等
  - 时间 | String | "yyyy-MM-dd HH:mm:ss.SSS"或"yyyy-MM-dd HH:mm:ss"，如需表示日期，可使用"yyyy-MM-dd 00:00:00" | 如注册时间、首次充值时间、月卡到期时间等
  - 布尔 | Boolean | - | 如是否首次过关、是否付费用户等
  - 列表 | Array(String) | 列表中的元素都会转变为字符串类型 | 如参战卡牌id["关羽"、"张飞"、"赵云“]，用户标签["高付费用户"、"潜在流失用户"]
  - 对象 | Object | 须符合子属性的取值规则，如子属性为字符串，子属性的取值需符合字符的默认上限是2KB | /
  - 对象组 | Array(Object) | 须符合子属性的取值规则，如子属性为字符串，子属性的取值需符合字符的默认上限是2KB | 例如一次战斗中多个角色出征，对象类型的属性可以包含不同类型的多个子属性，用于描述某个英雄的名称、星级、战力等；对象组类型可以将多个对象类型以数组的形式用一个字段表达，用以描述整个出征阵容。
  multi_terminal_rules:
  - '用户ID匹配：登录后客户端和服务端 #account_id 使用同一业务ID；未登录行为使用设备型 #distinct_id，并保证各端可回传/复用。'
  - 时间先后：无多时区时客户端初始化获取服务端时间；多时区敏感场景由服务端按客户端时区设置事件时间。
  - 事件与通用属性：无特殊需求时不多端重复采集同含义事件；等级、渠道、服务器等通用属性应在各端都包含。
  source_issues:
  - 用户属性前几行“数据类型”列出现 436，无法解释为客户端/服务端，按源值保留，不自行推断。
  - 事件属性 game_role_bind 区块存在列错位：源表第22行同时出现两列“服务端”，已按 event=game_role_bind 向右校正一列。
  - account_bind 在事件属性页出现两组相同基础定义，已合并；未判定任一组废弃。
  - share_click、h5_lottery 的基础版与企微/H5扩展版已按字段并集合并。
  - h5_activity_claim_reward 的 team_id 在源表重复两行；合并后保留“签到活动传空”的说明。
  - 公共事件属性 user_source 枚举为 1游戏内/2短信/3公众号/4微博/5B站/6社群；用户属性 user_source 枚举为 1社区/2H5活动。两处冲突，分析或开发前必须确认线上口径。
  - 部分 sns_id 说明仅列 yblbsns/jsccsns，企微扩展与部分事件已增加 xflsns；新增社区时需同步更新所有相关定义。
  - delete_post_success、delete_post_success_B 与 del_post_success 含义重叠；源表未明确旧事件是否废弃，因此全部保留。