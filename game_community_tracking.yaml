projects:
- project: 游戏社区
  project_code: game_community
  project_type: 跨游戏社区 / H5活动 / 企微私域
  source_document:
    title: 游戏社区埋点方案
    uploaded_file: a002066d-a0bc-4008-beba-c832d62803dd.xlsx
    imported_at: '2026-09-30'
    sheets:
    - 接入必知
    - 事件属性
    - 用户属性
    - 公共事件属性
    - 多用户id体系的埋点建议
    - 公共事件属性设置方式
    - 数据类型设计原则
    - 多端接入注意点
    - '#用户ID体系'
    - 添加企微需求
    repository_policy: 原始 Excel 不提交；本 YAML 保存结构化埋点口径。
  summary:
    unique_event_count: 22
    user_property_count: 21
    common_event_property_count: 5
    wecom_related_event_count: 10
  community_ids:
    yblbsns: 一步两步营地
    jsccsns: 极速冲刺社区
    xflsns: 下方了社区
  environment_values:
    dev: 开发环境
    sit: 测试环境
    prd: 正式环境
  core_rules:
  - TA 属性类型由字段首次入库时的类型决定，埋点上线前必须确认字段类型。
  - 公共事件属性作用于全部或大部分事件；客户端 SDK 在用户退出登录后需要手动清除已设置的公共事件属性。
  - 多端接入避免客户端/服务端重复采集同含义事件；通用属性需在各端保持一致。
  - '多端用户关联需统一 #account_id / #distinct_id；访客阶段 #distinct_id 必须有值。'
  - 客户端与服务端需统一时间基准，避免跨端事件前后顺序错乱。
  user_id_system:
    community_account_id: 社区UID；格式为 社区标识_环境_uid，例如 jsccsns_prd_10001；一步两步保持两段，不增加社区标识。
    distinct_id: 小游戏同 open_id；APP 同设备ID；H5活动页使用虚拟设备ID。
    generic_templates:
    - 单账号单角色：#account_id=玩家账号ID；#distinct_id=设备相关ID/访客ID。
    - 单账号多角色：#account_id=角色ID；角色所属账户ID作为自定义属性；#distinct_id=设备相关ID/访客ID。
    conflicts:
    - '用户属性页把 #account_id 定义为“社区UID”，公共事件属性页把 #account_id 显示为“角色ID”；两处冲突，使用前需按线上实际实现确认。'
    - 通用多用户ID建议页偏游戏角色模型；社区项目实际实现优先按线上验证结果。
  common_event_properties_format: 属性名 | 显示名 | 类型 | 说明 | 开发状态
  common_event_properties:
  - '#user_id | 用户在系统中的唯一用户标识 | bigint |  | 3、已完成'
  - '#distinct_id | 访客ID | varchar | 小游戏：同open_id / app：同设备id | 3、已完成'
  - '#account_id | 角色ID | varchar |  | 3、已完成'
  - user_source | 用户来源 | double | 1，游戏内；2，短信；3，公众号；4，微博；5，B站；6，社群 | 3、已完成
  - sns_id | 社区标识 | varchar | yblbsns，一步两步营地；jsccsns，极速冲刺社区； | 1、开发中
  user_properties_format: 采集端/源单元格 | 属性名 | 显示名 | 类型 | 更新方式 | 标签 | 说明 | 上报时间
  user_properties:
  - '436 | #user_id | 用户在系统中的唯一用户标识 | bigint | user_setOnce | 基本信息类 |  | 注册'
  - '436 | #distinct_id | 访客ID | varchar | user_setOnce | 基本信息类 | 小游戏：同open_id / app：同设备id / H5活动页：虚拟设备id | 注册'
  - '436 | #account_id | 社区UID | varchar | user_setOnce | 基本信息类 | 注册账号时记录 / 社区标识+_+环境+_+uid    例如正式环境  用户10001  就是jsccsns_prd_10001 / 注：一步两步保持为两段 不增加社区标识 | 注册'
  - ' | #active_time | 激活时间 | timestamp | user_setOnce | 时间类 | 首次进入（调起）客户端时间 | 注册'
  - '436 | #reg_time | 注册时间 | timestamp | user_setOnce | 时间类 | 注册账号时记录 | 注册'
  - '客户端 | open_id | 渠道账号id | varchar | user_setOnce | 基本信息类 | 微信登录验证成功时记录 | '
  - '客户端 | sex | 性别 | varchar | user_setOnce | 基本信息类 | 实名认证后上报 | '
  - '客户端 | bd_year | 出生年份 | varchar | user_setOnce | 基本信息类 | 实名认证后上报 | '
  - '客户端 | bd_month | 出生月份 | varchar | user_setOnce | 基本信息类 | 实名认证后上报 | '
  - '客户端 | bd_day | 出生日期 | varchar | user_setOnce | 基本信息类 | 实名认证后上报 | '
  - 服务端 | env | 环境 | varchar | user_setOnce | 基本信息类 | 区分测试/正式服： /  dev-开发环境   sit-测试环境 prd-正式环境 | 登出时
  - 服务端 | latest_login_time | 最后登录时间 | timestamp | user_set | 时间类 | 每次登出时 | 登出时
  - 服务端 | latest_online_time | 最后登出时间 | timestamp | user_set | 时间类 | 每次登出时 | 登出时
  - 服务端 | nick_name | 社区名称 | varchar | user_set | 基本信息类 | 每次登出时 | 登出时
  - 服务端 | follow_count | 关注人数 | double | user_set | 进度类 | 每次登出时 | 登出时
  - 服务端 | fans_count | 粉丝数 | double | user_set | 进度类 | 每次登出时 | 登出时
  - 服务端 | like_count | 获赞数 | double | user_set | 进度类 | 每次登出时 | 登出时
  - 服务端 | user_level | 用户等级 | double | user_set | 进度类 | 每次登出时 | 登出时
  - 服务端 | user_source | 用户来源 | double | user_setOnce | 基本信息类 | 1.社区；2.H5活动 | 注册
  - 服务端 | activity_id | H5活动id | varchar | user_setOnce | 基本信息类 | 通过H5活动注册用户上报 | 注册
  - 服务端 | sns_id | 社区标识 | varchar | user_setOnce | 基本信息类 | yblbsns，一步两步营地；jsccsns，极速冲刺社区 | 注册
