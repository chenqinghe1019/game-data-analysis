      schema_difference: "文档中的ta_app_start/ta_app_end未在本次线上事件列表发现；实际为ta_mg_launch/ta_mg_show/ta_mg_hide。每日挑战、水族馆等文档事件尚未在已上报事件列表发现，不能据此假设已上线。"
